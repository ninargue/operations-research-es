<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador - Programacion Dinamica (LCS)</title>
  <style>
    /* ---------------------------------------------------------------
       Variables y reset
    --------------------------------------------------------------- */
    :root {
      --bg:        #1a1a2e;
      --surface:   #16213e;
      --surface2:  #0f3460;
      --accent:    #e94560;
      --text:      #eaeaea;
      --text-dim:  #9a9ab0;
      --border:    #2a2a4a;

      --cell-empty:    #1e1e3a;
      --cell-active:   #1565c0;
      --cell-dep:      #7b6000;
      --cell-match:    #1b5e20;
      --cell-done:     #263238;
      --cell-path:     #1a4731;
      --cell-path-char:#00c853;

      --btn-bg:    #0f3460;
      --btn-hover: #e94560;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--accent);
      margin-bottom: 20px;
      text-align: center;
    }

    /* ---------------------------------------------------------------
       Layout principal
    --------------------------------------------------------------- */
    .layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .left-panel {
      flex: 1 1 520px;
      min-width: 300px;
    }

    .right-panel {
      flex: 0 0 220px;
      min-width: 200px;
    }

    /* ---------------------------------------------------------------
       Panel de secuencias
    --------------------------------------------------------------- */
    .sequences {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }

    .seq-block label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 4px;
    }

    .seq-block .seq-val {
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      color: var(--text);
      letter-spacing: 0.15em;
    }

    .seq-block .seq-len {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ---------------------------------------------------------------
       Controles
    --------------------------------------------------------------- */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    button {
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
    }

    button:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
    button:disabled { opacity: 0.4; cursor: default; }

    /* ---------------------------------------------------------------
       Status bar
    --------------------------------------------------------------- */
    .status {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-bottom: 16px;
      min-height: 42px;
      line-height: 1.55;
    }

    .status span { color: var(--text); font-weight: 600; }

    /* ---------------------------------------------------------------
       Tabla DP
    --------------------------------------------------------------- */
    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      font-family: 'Courier New', monospace;
    }

    th, td {
      width: 42px;
      height: 42px;
      text-align: center;
      vertical-align: middle;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      transition: background 0.2s, color 0.2s;
      position: relative;
    }

    th {
      background: var(--surface2);
      font-weight: 600;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    td { background: var(--cell-empty); color: var(--text-dim); }

    /* estados de celda */
    td.active    { background: var(--cell-active); color: #fff; }
    td.dep       { background: var(--cell-dep);    color: #ffd740; }
    td.match-dep { background: var(--cell-match);  color: #a5d6a7; }
    td.done      { background: var(--cell-done);   color: var(--text); }
    td.path      { background: var(--cell-path);   color: var(--cell-path-char); font-weight: 700; }

    td .char-badge {
      display: inline-block;
      background: var(--cell-path-char);
      color: #000;
      border-radius: 3px;
      padding: 0 3px;
      font-size: 0.7rem;
      position: absolute;
      top: 2px;
      right: 2px;
    }

    /* ---------------------------------------------------------------
       Leyenda
    --------------------------------------------------------------- */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      font-size: 0.76rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid var(--border);
    }

    /* ---------------------------------------------------------------
       Panel derecho — resultado LCS
    --------------------------------------------------------------- */
    .result-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .result-panel h2 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .result-panel .lcs-chars {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .lcs-char {
      width: 38px;
      height: 38px;
      background: var(--cell-path);
      color: var(--cell-path-char);
      border: 1px solid var(--cell-path-char);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .lcs-char.show { opacity: 1; transform: translateY(0); }

    .result-panel .stat {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .result-panel .stat span {
      color: var(--text);
      font-weight: 600;
    }

    .step-counter {
      font-size: 0.76rem;
      color: var(--text-dim);
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .step-counter span { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>

<h1>Visualizador — Programacion Dinamica (LCS)</h1>

<div class="layout">

  <!-- ---- Panel izquierdo ---------------------------------------- -->
  <div class="left-panel">

    <!-- Secuencias -->
    <div class="sequences">
      <div class="seq-block">
        <label>Secuencia X (filas)</label>
        <div class="seq-val" id="dispX"></div>
        <div class="seq-len" id="dispXlen"></div>
      </div>
      <div class="seq-block">
        <label>Secuencia Y (columnas)</label>
        <div class="seq-val" id="dispY"></div>
        <div class="seq-len" id="dispYlen"></div>
      </div>
    </div>

    <!-- Botones -->
    <div class="controls">
      <button id="btnStep">Siguiente Paso</button>
      <button id="btnAll">Resolver Todo</button>
      <button id="btnReset">Reiniciar</button>
    </div>

    <!-- Status -->
    <div class="status" id="status">Presiona <span>Siguiente Paso</span> para comenzar la construccion de la tabla DP.</div>

    <!-- Tabla -->
    <div class="table-wrap">
      <table id="dpTable"></table>
    </div>

    <!-- Leyenda -->
    <div class="legend">
      <div class="legend-item"><div class="swatch" style="background:#1565c0"></div> Celda activa</div>
      <div class="legend-item"><div class="swatch" style="background:#7b6000"></div> Dependencias (arriba, izq, diag)</div>
      <div class="legend-item"><div class="swatch" style="background:#1b5e20"></div> Match (diagonal coincidente)</div>
      <div class="legend-item"><div class="swatch" style="background:#263238"></div> Completada</div>
      <div class="legend-item"><div class="swatch" style="background:#1a4731; border:1px solid #00c853"></div> Ruta LCS (backtracking)</div>
    </div>

  </div>

  <!-- ---- Panel derecho ------------------------------------------ -->
  <div class="right-panel">
    <div class="result-panel">
      <h2>Resultado LCS</h2>
      <div class="lcs-chars" id="lcsChars"></div>
      <div class="stat">Longitud: <span id="lcsLen">—</span></div>
      <div class="stat">LCS: <span id="lcsStr">—</span></div>
      <div class="stat">Fase: <span id="phase">Llenado DP</span></div>
      <div class="step-counter">
        Paso: <span id="stepNum">0</span> / <span id="stepTotal">0</span>
      </div>
    </div>
  </div>

</div>

<script>
// -----------------------------------------------------------------------
// Datos del problema
// -----------------------------------------------------------------------
const X = "ABCBDAB";
const Y = "BDCABA";
const m = X.length;
const n = Y.length;

// -----------------------------------------------------------------------
// Estado global
// -----------------------------------------------------------------------
let dp        = [];
let dir       = [];
let steps     = [];   // lista de acciones a ejecutar
let stepIdx   = 0;
let lcsPath   = [];   // celdas de la LCS (i,j)
let lcsString = "";

// -----------------------------------------------------------------------
// Inicializar tabla dp y dir
// -----------------------------------------------------------------------
function initDP() {
  dp  = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  dir = Array.from({length: m + 1}, () => new Array(n + 1).fill(""));
}

// -----------------------------------------------------------------------
// Precalcular todos los pasos
// -----------------------------------------------------------------------
function buildSteps() {
  // 1. Llenado celda por celda
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      steps.push({type: "fill", i, j});
    }
  }
  // 2. Backtracking
  steps.push({type: "backtrack_start"});

  // Reconstruir LCS para generar pasos de backtracking
  // (precalculamos dp completo aqui solo para obtener los pasos)
  let dpTmp  = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  let dirTmp = Array.from({length: m + 1}, () => new Array(n + 1).fill(""));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (X[i-1] === Y[j-1]) {
        dpTmp[i][j]  = dpTmp[i-1][j-1] + 1;
        dirTmp[i][j] = "D";
      } else if (dpTmp[i-1][j] >= dpTmp[i][j-1]) {
        dpTmp[i][j]  = dpTmp[i-1][j];
        dirTmp[i][j] = "U";
      } else {
        dpTmp[i][j]  = dpTmp[i][j-1];
        dirTmp[i][j] = "L";
      }
    }
  }
  let bi = m, bj = n;
  while (bi > 0 && bj > 0) {
    if (dirTmp[bi][bj] === "D") {
      steps.push({type: "bt_match", i: bi, j: bj, ch: X[bi-1]});
      bi--; bj--;
    } else if (dirTmp[bi][bj] === "U") {
      steps.push({type: "bt_skip", i: bi, j: bj});
      bi--;
    } else {
      steps.push({type: "bt_skip", i: bi, j: bj});
      bj--;
    }
  }
  steps.push({type: "done"});
}

// -----------------------------------------------------------------------
// Construir tabla HTML
// -----------------------------------------------------------------------
function buildTable() {
  const tbl = document.getElementById("dpTable");
  tbl.innerHTML = "";

  // Fila de encabezado (Y)
  const hRow = tbl.insertRow();
  const thCorner = document.createElement("th");
  thCorner.textContent = "";
  hRow.appendChild(thCorner);
  const thEmpty = document.createElement("th");
  thEmpty.textContent = '""';
  hRow.appendChild(thEmpty);
  for (let j = 0; j < n; j++) {
    const th = document.createElement("th");
    th.textContent = Y[j];
    hRow.appendChild(th);
  }

  // Filas de datos (X en filas)
  for (let i = 0; i <= m; i++) {
    const row = tbl.insertRow();
    // Etiqueta fila
    const thRow = document.createElement("th");
    thRow.textContent = i === 0 ? '""' : X[i-1];
    row.appendChild(thRow);
    // Celdas
    for (let j = 0; j <= n; j++) {
      const td = row.insertCell();
      td.id    = `cell-${i}-${j}`;
      td.textContent = "0";
    }
  }
}

// -----------------------------------------------------------------------
// Utilidad: limpiar clases de coloreado
// -----------------------------------------------------------------------
function clearHighlights() {
  document.querySelectorAll("td").forEach(td => {
    td.className = "";
  });
}

function getCell(i, j) {
  return document.getElementById(`cell-${i}-${j}`);
}

// -----------------------------------------------------------------------
// Ejecutar un paso
// -----------------------------------------------------------------------
function execStep(step) {
  clearHighlights();

  if (step.type === "fill") {
    const {i, j} = step;

    // Determinar valor y direccion
    let val, d, isMatch = false;
    if (X[i-1] === Y[j-1]) {
      val = dp[i-1][j-1] + 1;
      d   = "D";
      isMatch = true;
    } else if (dp[i-1][j] >= dp[i][j-1]) {
      val = dp[i-1][j];
      d   = "U";
    } else {
      val = dp[i][j-1];
      d   = "L";
    }
    dp[i][j]  = val;
    dir[i][j] = d;

    // Colorear celda activa
    getCell(i, j).className = "active";
    getCell(i, j).textContent = val;

    // Colorear dependencias
    if (isMatch) {
      getCell(i-1, j-1).className = "match-dep";
    } else {
      getCell(i-1, j-1).className = "dep";
    }
    getCell(i-1, j).className = getCell(i-1, j).className || "dep";
    getCell(i, j-1).className = getCell(i, j-1).className || "dep";

    // Marcar celdas ya completadas (antes de la actual)
    for (let r = 1; r <= m; r++) {
      for (let c = 1; c <= n; c++) {
        if (r === i && c === j) continue;
        if (r < i || (r === i && c < j)) {
          const td = getCell(r, c);
          if (!td.className) td.className = "done";
        }
      }
    }

    // Status
    if (isMatch) {
      setStatus(
        `i=${i} (X[${i}]='${X[i-1]}'), j=${j} (Y[${j}]='${Y[j-1]}'): ` +
        `<span>MATCH</span> — dp[${i}][${j}] = dp[${i-1}][${j-1}] + 1 = <span>${dp[i-1][j-1]}</span> + 1 = <span>${val}</span>`
      );
    } else {
      const from = dp[i-1][j] >= dp[i][j-1] ? `dp[${i-1}][${j}]=${dp[i-1][j]}` : `dp[${i}][${j-1}]=${dp[i][j-1]}`;
      setStatus(
        `i=${i} (X[${i}]='${X[i-1]}'), j=${j} (Y[${j}]='${Y[j-1]}'): ` +
        `no coincidencia — dp[${i}][${j}] = max(dp[${i-1}][${j}]=${dp[i-1][j]}, dp[${i}][${j-1}]=${dp[i][j-1]}) = <span>${val}</span> (de ${from})`
      );
    }

    document.getElementById("stepNum").textContent = stepIdx + 1;
    document.getElementById("phase").textContent   = "Llenado DP";

  } else if (step.type === "backtrack_start") {
    // Marcar toda la tabla como completada
    for (let r = 1; r <= m; r++) {
      for (let c = 1; c <= n; c++) {
        getCell(r, c).className = "done";
      }
    }
    document.getElementById("lcsLen").textContent = dp[m][n];
    setStatus(`Llenado completo. dp[${m}][${n}] = <span>${dp[m][n]}</span>. Iniciando backtracking desde esquina (${m},${n})...`);
    document.getElementById("phase").textContent = "Backtracking";
    document.getElementById("stepNum").textContent = stepIdx + 1;

  } else if (step.type === "bt_match") {
    const {i, j, ch} = step;
    const td = getCell(i, j);
    td.className = "path";
    td.innerHTML = `${dp[i][j]}<span class="char-badge">${ch}</span>`;
    lcsPath.unshift({i, j, ch});
    setStatus(
      `Backtrack (${i},${j}): <span>MATCH '${ch}'</span> — se incluye en la LCS. Mover diagonal a (${i-1},${j-1}).`
    );
    document.getElementById("phase").textContent   = "Backtracking";
    document.getElementById("stepNum").textContent = stepIdx + 1;

  } else if (step.type === "bt_skip") {
    const {i, j} = step;
    const d = dir[i][j];
    const td = getCell(i, j);
    td.className = "done";
    const hacia = d === "U" ? `(${i-1},${j})` : `(${i},${j-1})`;
    setStatus(
      `Backtrack (${i},${j}): sin match — mover ${d === "U" ? "arriba" : "izquierda"} hacia ${hacia}.`
    );
    document.getElementById("phase").textContent   = "Backtracking";
    document.getElementById("stepNum").textContent = stepIdx + 1;

  } else if (step.type === "done") {
    // Construir LCS final
    lcsString = lcsPath.map(p => p.ch).join("");
    document.getElementById("lcsLen").textContent = lcsString.length;
    document.getElementById("lcsStr").textContent = lcsString;

    // Mostrar caracteres animados
    const container = document.getElementById("lcsChars");
    container.innerHTML = "";
    lcsString.split("").forEach((ch, idx) => {
      const div = document.createElement("div");
      div.className = "lcs-char";
      div.textContent = ch;
      container.appendChild(div);
      setTimeout(() => div.classList.add("show"), idx * 120);
    });

    setStatus(`Backtracking completado. LCS = <span>${lcsString}</span>, longitud = <span>${lcsString.length}</span>.`);
    document.getElementById("phase").textContent   = "Completado";
    document.getElementById("stepNum").textContent = stepIdx + 1;
    document.getElementById("btnStep").disabled = true;
    document.getElementById("btnAll").disabled  = true;
  }
}

// -----------------------------------------------------------------------
// Utilitarios UI
// -----------------------------------------------------------------------
function setStatus(html) {
  document.getElementById("status").innerHTML = html;
}

// -----------------------------------------------------------------------
// Avanzar un paso
// -----------------------------------------------------------------------
function doStep() {
  if (stepIdx >= steps.length) return;
  execStep(steps[stepIdx]);
  stepIdx++;
}

// -----------------------------------------------------------------------
// Resolver todo
// -----------------------------------------------------------------------
function doAll() {
  document.getElementById("btnStep").disabled = true;
  document.getElementById("btnAll").disabled  = true;

  function runNext() {
    if (stepIdx >= steps.length) return;
    execStep(steps[stepIdx]);
    stepIdx++;
    if (steps[stepIdx - 1].type !== "done") {
      setTimeout(runNext, 60);
    }
  }
  runNext();
}

// -----------------------------------------------------------------------
// Reiniciar
// -----------------------------------------------------------------------
function doReset() {
  stepIdx   = 0;
  lcsPath   = [];
  lcsString = "";
  steps     = [];

  initDP();
  buildSteps();
  buildTable();

  document.getElementById("lcsLen").textContent  = "—";
  document.getElementById("lcsStr").textContent  = "—";
  document.getElementById("lcsChars").innerHTML  = "";
  document.getElementById("phase").textContent   = "Llenado DP";
  document.getElementById("stepNum").textContent = "0";
  document.getElementById("status").innerHTML    =
    'Presiona <span>Siguiente Paso</span> para comenzar la construccion de la tabla DP.';

  document.getElementById("btnStep").disabled = false;
  document.getElementById("btnAll").disabled  = false;
}

// -----------------------------------------------------------------------
// Inicializacion
// -----------------------------------------------------------------------
(function init() {
  // Mostrar secuencias
  document.getElementById("dispX").textContent    = X;
  document.getElementById("dispXlen").textContent = `longitud m = ${m}`;
  document.getElementById("dispY").textContent    = Y;
  document.getElementById("dispYlen").textContent = `longitud n = ${n}`;

  initDP();
  buildSteps();
  buildTable();

  document.getElementById("stepTotal").textContent = steps.length;
  document.getElementById("stepNum").textContent   = "0";

  document.getElementById("btnStep").addEventListener("click", doStep);
  document.getElementById("btnAll").addEventListener("click",  doAll);
  document.getElementById("btnReset").addEventListener("click", doReset);
})();
</script>

</body>
</html>
