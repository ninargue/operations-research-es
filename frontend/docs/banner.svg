<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1f3c"/>
      <stop offset="50%"  stop-color="#1a3a6e"/>
      <stop offset="100%" stop-color="#0e4d8c"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7b5ea7" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7b5ea7"/>
      <stop offset="60%"  stop-color="#3a86b4"/>
      <stop offset="100%" stop-color="#3a86b4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bgGrad)" rx="0"/>

  <!-- Decorative network — right side -->
  <!-- Nodes -->
  <circle cx="980" cy="60"  r="5" fill="#7b5ea7" opacity="0.8"/>
  <circle cx="1040" cy="40" r="4" fill="#3a86b4" opacity="0.7"/>
  <circle cx="1100" cy="80" r="6" fill="#c75b7a" opacity="0.8"/>
  <circle cx="1060" cy="120" r="4" fill="#7b5ea7" opacity="0.6"/>
  <circle cx="1130" cy="150" r="5" fill="#3a86b4" opacity="0.7"/>
  <circle cx="1000" cy="140" r="4" fill="#c75b7a" opacity="0.6"/>
  <circle cx="950"  cy="100" r="3" fill="#3a86b4" opacity="0.5"/>
  <circle cx="1160" cy="60"  r="3" fill="#7b5ea7" opacity="0.5"/>
  <circle cx="1080" cy="170" r="4" fill="#3a86b4" opacity="0.6"/>
  <circle cx="930"  cy="50"  r="3" fill="#c75b7a" opacity="0.4"/>

  <!-- Edges -->
  <line x1="980" y1="60"  x2="1040" y2="40"  stroke="#7b5ea7" stroke-width="1" opacity="0.4"/>
  <line x1="1040" y1="40" x2="1100" y2="80"  stroke="#3a86b4" stroke-width="1" opacity="0.4"/>
  <line x1="1100" y1="80" x2="1060" y2="120" stroke="#c75b7a" stroke-width="1" opacity="0.4"/>
  <line x1="1060" y1="120" x2="1130" y2="150" stroke="#7b5ea7" stroke-width="1" opacity="0.35"/>
  <line x1="1060" y1="120" x2="1000" y2="140" stroke="#3a86b4" stroke-width="1" opacity="0.35"/>
  <line x1="980"  y1="60"  x2="950"  y2="100" stroke="#3a86b4" stroke-width="1" opacity="0.3"/>
  <line x1="950"  y1="100" x2="1000" y2="140" stroke="#c75b7a" stroke-width="1" opacity="0.3"/>
  <line x1="1100" y1="80"  x2="1160" y2="60"  stroke="#7b5ea7" stroke-width="1" opacity="0.3"/>
  <line x1="1130" y1="150" x2="1080" y2="170" stroke="#3a86b4" stroke-width="1" opacity="0.35"/>
  <line x1="980"  y1="60"  x2="930"  y2="50"  stroke="#c75b7a" stroke-width="1" opacity="0.25"/>

  <!-- Decorative network — left side (subtle) -->
  <circle cx="60"  cy="80"  r="4" fill="#3a86b4" opacity="0.35"/>
  <circle cx="100" cy="50"  r="3" fill="#7b5ea7" opacity="0.3"/>
  <circle cx="80"  cy="160" r="3" fill="#c75b7a" opacity="0.3"/>
  <circle cx="40"  cy="140" r="3" fill="#3a86b4" opacity="0.25"/>
  <line x1="60" y1="80" x2="100" y2="50"   stroke="#7b5ea7" stroke-width="1" opacity="0.2"/>
  <line x1="60" y1="80" x2="80"  y2="160"  stroke="#3a86b4" stroke-width="1" opacity="0.2"/>
  <line x1="40" y1="140" x2="80" y2="160"  stroke="#c75b7a" stroke-width="1" opacity="0.2"/>

  <!-- Horizontal accent line -->
  <line x1="0" y1="185" x2="1200" y2="185" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Main title -->
  <text x="140" y="95"
        font-family="ui-sans-serif, system-ui, -apple-system, Arial, sans-serif"
        font-size="42" font-weight="700" fill="#ffffff"
        letter-spacing="-0.5">
    Operations Research
  </text>
  <text x="143" y="140"
        font-family="ui-sans-serif, system-ui, -apple-system, Arial, sans-serif"
        font-size="38" font-weight="300" fill="#93c5fd"
        letter-spacing="0.5">
    en Español
  </text>

  <!-- Subtitle -->
  <text x="143" y="170"
        font-family="ui-sans-serif, system-ui, -apple-system, Arial, sans-serif"
        font-size="14" fill="#60a5fa" opacity="0.85"
        letter-spacing="1.5">
    MODELOS MATEMÁTICOS  ·  CÓDIGO PYTHON  ·  DEMOS POR SECTOR
  </text>

  <!-- Branch colour pills bottom-right -->
  <rect x="700" y="182" width="130" height="22" rx="11" fill="#7b5ea7" opacity="0.85"/>
  <text x="765" y="197" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Determinísticos</text>

  <rect x="842" y="182" width="118" height="22" rx="11" fill="#c75b7a" opacity="0.85"/>
  <text x="901" y="197" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Estocásticos</text>

  <rect x="972" y="182" width="90" height="22" rx="11" fill="#3a86b4" opacity="0.85"/>
  <text x="1017" y="197" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Híbridos</text>
</svg>
